<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050B1A">
<title>অ্যাডমিন · গুঞ্জরণ আইটি টিম</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- লগইন -->
<div class="login hidden" id="loginView">
  <form class="lbox" id="loginForm" novalidate>
    <img class="logo" src="../assets/favicon.svg" alt="">
    <div class="mono g" style="font-size:12px;letter-spacing:1px">// ADMIN PANEL</div>
    <h1>গুঞ্জরণ অ্যাডমিন</h1>
    <p class="m" style="font-size:14px;margin-bottom:18px">শুধু অনুমোদিত অ্যাডমিনদের জন্য।</p>
    <div class="field"><label for="le">ইমেইল</label><input type="email" id="le" autocomplete="username" required></div>
    <div class="field"><label for="lp">পাসওয়ার্ড</label><div class="pw"><input type="password" id="lp" autocomplete="current-password" required><button type="button" id="pwt" aria-label="দেখান/লুকান">👁</button></div></div>
    <div class="lerr" id="lerr" role="alert"></div>
    <button class="btn p" style="width:100%;margin-top:8px;padding:13px" type="submit">লগইন করুন</button>
  </form>
</div>

<!-- অ্যাপ -->
<div class="shell hidden" id="appView">
  <aside class="side">
    <div class="brand"><img src="../assets/favicon.svg" alt=""><div><b>গুঞ্জরণ</b><small>ADMIN PANEL</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <a class="btn sm" href="../" target="_blank" rel="noopener" style="justify-content:flex-start">↗ সাইট দেখুন</a>
      <div class="who"><div class="av" id="whoav">A</div><span id="who"></span></div>
      <button class="btn sm d" id="logout2" style="justify-content:flex-start">⎋ লগআউট</button>
    </div>
  </aside>
  <div class="scrim"></div>
  <div class="mainc">
    <header class="top">
      <button class="btn ico burger" id="burger" aria-label="মেনু">☰</button>
      <h1 id="pageTitle"></h1>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>

<script src="../js/core/site-schema.js"></script>
<script src="../js/core/supabase.js"></script>
<script src="js/ui.js"></script>
<script src="js/img.js"></script>
<script src="js/pages/content.js"></script>
<script src="js/pages/editor.js"></script>
<script src="js/pages/inbox.js"></script>
<script src="js/app.js"></script>
</body>
</html>
